name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: authuser
          POSTGRES_PASSWORD: authpassword
          POSTGRES_DB: authdb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --workspace=server

      - name: Install client dependencies
        run: npm ci --workspace=client

      - name: TypeScript typecheck — server
        run: npm run typecheck --workspace=server

      - name: TypeScript typecheck — client
        run: cd client && npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Run test suite with coverage
        working-directory: server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://authuser:authpassword@localhost:5432/authdb_test
          REDIS_URL: redis://localhost:6379/1
          JWT_ACCESS_SECRET: ci-test-access-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-characters
          JWT_ACCESS_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 7d
          SMTP_HOST: smtp.ethereal.email
          SMTP_PORT: 587
          SMTP_USER: test
          SMTP_PASS: test
          CLIENT_URL: http://localhost:5173
          SERVER_URL: http://localhost:3001
          GOOGLE_CLIENT_ID: test-google-client-id
          GOOGLE_CLIENT_SECRET: test-google-client-secret
          GITHUB_CLIENT_ID: test-github-client-id
          GITHUB_CLIENT_SECRET: test-github-client-secret
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage/

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm ci --workspace=server
      - run: npm ci --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client
        run: npm run build --workspace=client